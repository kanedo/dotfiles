# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# tpm plugins. tpm itself is bootstrapped by install.sh, not listed here.
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'egel/tmux-gruvbox'

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"

# Use vi-style keys in copy mode. Without this, the copy-mode-vi bindings below
# are never active (tmux defaults to mode-keys emacs) and 'y' does nothing.
setw -g mode-keys vi

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
# Copy the selection to the system clipboard with 'y' (or Enter).
#
# The cross-platform mechanism is OSC 52 (see set-clipboard / terminal-features
# below): tmux hands the selection to the terminal, which owns the real
# pasteboard. That works on Linux and macOS, and even across ssh (remote tmux ->
# local terminal -> local pasteboard), so the OSC 52 setup stays on everywhere.
#
# On macOS we additionally pipe through pbcopy (the native pasteboard command)
# so copies still land in terminals that ignore OSC 52, e.g. Terminal.app or
# iTerm2 with clipboard access disabled. pbcopy does not exist on Linux, so
# there the plain copy-selection path runs and OSC 52 does the work.
if-shell 'command -v pbcopy >/dev/null 2>&1' \
	'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy" ; bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"' \
	'bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel ; bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel'

# Bring back clear screen under tmux prefix
bind C-l send-keys 'C-l'

# renumber windows from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# show session name in title
set-option -g set-titles on
set -g set-titles-string "#T"

# rename windows to the current directory
set-option -g automatic-rename on
set-option -g automatic-rename-format "#{b:pane_current_path}"

# Activity Monitoring
setw -g monitor-activity off
set -g visual-activity off

# ressurect tmux sessions
set -g @continuum-restore 'on'

# Make mouse useful in copy mode
setw -g mouse on

# Scroll History
set -g history-limit 30000

# Terminal capabilities
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB"
# Undercurl + colored underlines (e.g. LSP diagnostics in nvim)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# System clipboard via OSC 52 (forwards copies to kitty -> macOS pasteboard)
set -g set-clipboard on
%if "#{>=:#{version},3.2}"
  set -ga terminal-features '*:clipboard'
%else
  set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'
%endif

# allow-passthrough is tmux 3.3+ (needed for kitty graphics protocol through tmux)
%if "#{>=:#{version},3.3}"
  set -g allow-passthrough on
%endif

# open a new window
bind N new-session

# source theme file
# source-file ~/.tmux/theme.sh
set -g @tmux-gruvbox 'dark' # or 'light'

# Initializes TMUX plugin manager.
# Keep this line at the very bottom of tmux.conf.
run-shell '~/.tmux/plugins/tpm/tpm'
